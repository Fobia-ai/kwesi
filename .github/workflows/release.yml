name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish release artifacts to GitHub'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

# Auto-update (electron/updates/autoUpdate.ts) reads the latest PUBLISHED
# GitHub Release: it fetches latest-linux.yml / latest-mac.yml / latest.yml
# from it, then the installer (and its .blockmap, for differential
# downloads) those files point to. So every one of those files has to be
# uploaded, and a tag push publishes the release rather than leaving it a
# draft -- drafts are invisible to the updater. A manual run
# (workflow_dispatch) still only ever makes a draft.

jobs:
  # The version in latest*.yml comes from package.json, not the tag. If they
  # disagree, installed apps compare against the wrong version, so fail
  # before spending time on three builds.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag matches package.json version
        if: github.event_name == 'push'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

  release-linux:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package for Linux
        run: npm run package:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          if-no-files-found: error

  release-macos:
    needs: check-version
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up macOS signing keychain
        env:
          MACOS_CERT_P12: ${{ secrets.CSC_LINK }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || secrets.CSC_KEY_PASSWORD }}
        run: |
          set -e
          KEYCHAIN_PATH="${{ github.workspace }}/kwesi-signing.keychain"

          # Decode the base64-encoded .p12 into a temporary file.
          echo "$MACOS_CERT_P12" | base64 --decode > certificate.p12

          # Create a dedicated keychain in the workspace, make it the default/search keychain, and unlock it.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"

          # Import the certificate, allowing codesign/security to access it.
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Clean up the decoded .p12 and show what identities are now available.
          rm -f certificate.p12
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build and package for macOS
        # Do NOT pass CSC_LINK/CSC_KEY_PASSWORD here. The keychain step above
        # already imported the cert; passing CSC_LINK would make electron-builder
        # create its own temporary keychain, which fails on macOS 15.
        run: npm run package:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_KEYCHAIN: ${{ github.workspace }}/kwesi-signing.keychain
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ICONS_DIR: build/icons

      - name: Verify macOS artifacts
        run: ls -lah release

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          # The zip is what MacUpdater installs from; the dmg is for manual
          # downloads.
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  release-windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package for Windows
        run: npm run package:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  create-release:
    needs: [release-linux, release-macos, release-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: release

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: release

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release

      - name: List release artifacts
        run: ls -lah release

      # A release without these is silently invisible to every installed copy.
      - name: Check update metadata is present
        run: |
          for f in latest-linux.yml latest-mac.yml latest.yml; do
            test -f "release/$f" || { echo "::error::release/$f is missing"; exit 1; }
          done

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || inputs.publish
        with:
          # Published on a tag push so installed apps see it; a draft from a
          # manual run. A tag with a pre-release suffix (v1.2.0-beta.1) is
          # marked prerelease, which the updater also skips.
          draft: ${{ github.event_name != 'push' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release/*
