# Build toolchain for MuseCoco's optional GPU attention kernel
# (pytorch-fast-transformers' causal_product_cuda). Used only while building,
# by the Training screen's "GPU acceleration" action, then deleted.
#
# Explicit lock: every package by exact URL + md5, so the toolchain is
# identical on every machine. Regenerate (pinned micromamba 2.9.0) with:
#   micromamba create -p <env> -c nvidia/label/cuda-11.3.1 -c conda-forge --override-channels \
#     cuda-nvcc=11.3.122 cuda-cudart=11.3.109 cuda-thrust=11.3.109 libcurand=10.2.4.109 \
#     gxx_linux-64=10.4.0 sysroot_linux-64=2.17 libxcrypt=4.4.36
#   micromamba env export --explicit --md5 -p <env>
#
# Why each top-level pin (each one was a real build failure without it):
#   cuda-nvcc 11.3       must match the CUDA version torch==1.11.0+cu113 was built with
#   cuda-thrust          torch's c10 headers include thrust/complex.h under nvcc
#   libcurand            fast-transformers' hamming-clustering kernel includes curand.h
#   gxx_linux-64 10      CUDA 11.3 rejects host compilers newer than GCC 10
#   sysroot_linux-64 2.17  newer kernel headers declare __s128, which nvcc 11.3 can't parse
#   libxcrypt            Python 3.8's headers include crypt.h, absent from that sysroot
