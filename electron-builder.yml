# electron-builder config for Phase 13 (Polish, Packaging & Distribution).
# See kwesi.docs/04-roadmap.md's Phase 13 section and
# kwesi.docs/02-architecture.md's "Packaging & signing" section for the full
# writeup of what this does and doesn't cover.
#
# Scope note: this packages the Electron app shell + renderer + SQLite data
# layer, PLUS each model's hand-written Python server source (server.py,
# requirements.txt, _run_interactive.py, ...) as extraResources below --
# ~136KB total, since the multi-gigabyte git-cloned vendor/ trees and the
# per-model venvs (KWESI_VENVS_DIR) are still deliberately excluded (they're
# fetched/built on demand from Settings > Environment into a writable
# KWESI_HOME location, not shippable). At startup syncShippedServers copies
# those shipped files from process.resourcesPath/servers into the writable
# serversRoot so pip-based installs (`uv pip install -r .../requirements.txt`)
# and hand-wrapped server spawns (`.../server.py`) actually find them beside
# the cloned vendor/. Before this, only ace-step-1.5 (fully self-contained in
# its own clone) could install/run from a packaged build.
appId: ai.fobia.kwesi
productName: Kwesi
copyright: "Copyright © 2026 Fobia"

# Application icon. build/icons/ contains icon.ico (Windows), icon.icns (macOS),
# and size-named PNGs for Linux/AppImage, all generated from src/assets/logo.png.
directories:
  output: release
  buildResources: build

# Only the compiled output + package.json -- node_modules production
# dependencies are included automatically by electron-builder regardless of
# this list (see its docs: "you don't need to add node_modules to files").
files:
  - dist/**/*
  - dist-electron/**/*
  - build/icons/**/*
  - package.json

# Each model's hand-written server source only (server.py, requirements.txt,
# _run_interactive.py, README). The git-cloned vendor/ trees (~228MB) and
# __pycache__/*.pyc are excluded -- vendor/ is fetched on demand at install
# time. Lands at process.resourcesPath/servers; syncShippedServers (main.ts)
# copies it into the writable serversRoot at startup. See the scope note above.
extraResources:
  - from: servers
    to: servers
    filter:
      - "**/*"
      - "!**/vendor/**"
      - "!**/__pycache__/**"
      - "!**/*.pyc"

# better-sqlite3 ships a compiled .node native addon (better_sqlite3.node).
# Native addons can't be dlopen'd from inside an asar archive, so its
# directory must be unpacked into app.asar.unpacked rather than packed --
# electron-builder does detect *.node files automatically, but this is kept
# explicit rather than relied on implicitly, since a silent packaging
# failure here (the #1 way a packaged build differs from dev) is exactly
# the kind of thing worth being defensive about.
asarUnpack:
  - "**/node_modules/better-sqlite3/**/*"
  - build/icons/**/*

# Default is true; kept explicit -- electron-builder rebuilds native
# dependencies (better-sqlite3) against the target Electron's ABI as part
# of packaging, independent of the dev-time `postinstall` electron-rebuild
# step (which only targets whatever Electron version is currently
# installed). Without this, a packaged build's better-sqlite3 could be
# built against the wrong Node ABI and fail to load at runtime.
npmRebuild: true
buildDependenciesFromSource: false

# --- Linux: the platform actually built + verified on this machine ---
linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  maintainer: "Fobia <hello@fobia.ai>"
  # Use the top-level build/icon.png for Linux. The build/icons/icon.icns is a
  # newer/compressed .icns format that electron-builder's Linux icon converter
  # cannot decode via OpenJPEG; pointing linux.icon at a plain PNG avoids that path.
  icon: build/icon.png

# --- macOS: signed/notarized via CI secrets; unsigned otherwise ---
# The GitHub Actions runner creates a dedicated keychain from CSC_LINK/
# CSC_KEY_PASSWORD and points electron-builder at it with CSC_KEYCHAIN.
# Notarization is enabled when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and
# APPLE_TEAM_ID are present. Without credentials, electron-builder skips
# signing and the .dmg shows the standard Gatekeeper warning.
mac:
  # dmg is what people download by hand; zip is what electron-updater's
  # MacUpdater actually installs from (it can't apply a dmg), so both ship.
  # Both for Intel (x64) and Apple silicon (arm64): separate files rather
  # than one universal build, so each download is half the size. The CI
  # runner is Apple silicon and cross-builds x64.
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  # The arch is always in the name (by default x64 gets none), so the two
  # dmgs can't be confused. MacUpdater also relies on it: on Apple silicon
  # it picks the files with "arm64" in the name from latest-mac.yml, and on
  # Intel the ones without.
  artifactName: "${productName}-${version}-${arch}.${ext}"
  category: public.app-category.music
  icon: build/icons/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true

# --- Windows: config-only on this machine, no Authenticode cert exists ---
# Same posture as macOS: electron-builder already skips signing when
# CSC_LINK/CSC_KEY_PASSWORD are unset for nsis -- nothing here requires
# them.
win:
  target:
    - nsis
  icon: build/icons/icon.ico

nsis:
  # No spaces: the default "Kwesi Setup X.exe" gets renamed to
  # "Kwesi.Setup.X.exe" when uploaded to a GitHub Release, which then no
  # longer matches the `url` electron-builder wrote into latest.yml, so
  # Windows updates 404.
  artifactName: "${productName}-Setup-${version}.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# electron-updater checks this feed at runtime (see
# electron/updates/autoUpdate.ts). The repo is public, so update checks are
# plain anonymous HTTPS requests -- no token ships in the app. This block is
# also what makes electron-builder write latest-linux.yml / latest-mac.yml /
# latest.yml (and the .blockmap files) next to the installers, which
# .github/workflows/release.yml uploads to the GitHub Release. Only a
# PUBLISHED, non-prerelease release is visible to the updater -- drafts are
# not. `--publish=never` is used in every package:* script, so electron-builder
# itself never uploads anything; the workflow does.
publish:
  - provider: github
    owner: Fobia-ai
    repo: kwesi
    releaseType: release
